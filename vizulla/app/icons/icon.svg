<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Vizulla mark: two glass panes (tabs/windows) meeting in a V.
       One solid, one translucent: the overlap is where the page comes into view.
       Flat blue, no shadows. macOS grid: 824px tile on a 1024 canvas. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <g stroke-linecap="round" stroke-width="136" fill="none">
    <line x1="650" y1="312" x2="512" y2="712" stroke="#ffffff" stroke-opacity="0.55"/>
    <line x1="374" y1="312" x2="512" y2="712" stroke="#ffffff"/>
  </g>
</svg>
